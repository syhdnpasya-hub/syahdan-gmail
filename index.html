<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMAIL HUB SYAHDAN</title>
  <style>
    body { background: #f3e8ff; font-family: 'Poppins',Arial; padding: 20px; margin: 0; }
    .box { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; }
    .logo h1 { color: #9c27b0; text-align: center; }
    .password { background: #fefce8; padding: 10px; border-radius: 8px; border-left: 4px solid #facc15; margin-bottom: 20px; }
    .generate-btn { background: #9333ea; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
    .gmail-card { background: #faf5ff; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .badge.belum { background: #ffecb3; color: #ff6f00; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
    .salin-btn { background: #9333ea; color: white; width: 100%; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; display: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo"><h1>GMAIL HUB SYAHDAN</h1></div>
    <div class="password"><b>Password Wajib:</b> sgsg1122</div>
    <h3>Generate Email Otomatis</h3>
    <button class="generate-btn" onclick="generateEmails()">+ Generate 100 Email</button>
    <div id="listEmail"></div>
    <button class="salin-btn" id="btnSalin" onclick="salinSemua()">Salin Semua</button>
  </div>
<script>
  let emails = [];
  const namaDepan = ['budi','andi','joko','agus','dedi','eko','rizki','ahmad','fajar','hadi','siti','ani','dewi','rini','yuni','lisa','dina','maya','nita','sari','agung','bayu','dimas','galih','ilham','krisna','putra','surya','wawan','yoga'];
  const namaBelakang = ['saputra','wijaya','pratama','setiawan','santoso','nugroho','prakoso','ramadhan','lestari','wati','ayu','indah','putri','sari','melati','anggraini','rahmawati','hidayat','firmansyah','kurniawan','gunawan','sukma','permata','utami'];
  function generateRandomEmail() {
    const depan = namaDepan[Math.floor(Math.random() * namaDepan.length)];
    const belakang = namaBelakang[Math.floor(Math.random() * namaBelakang.length)];
    const angka = Math.floor(Math.random() * 100);
    return `${depan}${belakang}${angka}@gmail.com`;
  }
  function generateEmails() {
    emails = [];
    for(let i = 0; i < 100; i++) { emails.push(generateRandomEmail()); }
    tampilkanEmail();
  }
  function tampilkanEmail() {
    const list = document.getElementById('listEmail');
    list.innerHTML = '';
    emails.forEach(email => {
      list.innerHTML += `<div class="gmail-card"><span>${email}</span><span class="badge belum">Belum Stor</span></div>`;
    });
    document.getElementById('btnSalin').style.display = 'block';
  }
  function salinSemua() {
    navigator.clipboard.writeText(emails.join('\n'));
    alert('100 Email berhasil disalin!');
  }
</script>
</body>
</html>
