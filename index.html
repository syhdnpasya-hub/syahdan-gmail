<!DOCTYPE html>
<html>
<head>
<title>GMAIL HUB SYAHDAN</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:'Poppins',Arial; background:linear-gradient(135deg,#f3e5f5 0%,#e1bee7 100%); padding:20px; margin:0}
.box{background:white; padding:25px; border-radius:25px; max-width:500px; margin:auto; box-shadow:0 10px 30px rgba(156,39,176,0.15)}
.logo{text-align:center; margin-bottom:20px}
.logo h1{color:#9c27b0; margin:0}
.tabs{display:flex; background:#f3e5f5; border-radius:15px; padding:5px; margin-bottom:20px}
.tabs button{flex:1; border:none; background:transparent; padding:12px; border-radius:12px; font-weight:bold; cursor:pointer; color:#7b1fa2}
.tabs .active{background:white; color:#9c27b0; box-shadow:0 2px 8px rgba(156,39,176,0.2)}
.btn-google{width:100%; padding:12px; border:2px solid #e1bee7; background:#fafafa; border-radius:12px; display:flex; align-items:center; justify-content:center; gap:10px; font-weight:bold; cursor:pointer; color:#7b1fa2}
input{width:100%; padding:14px; margin:10px 0; border-radius:12px; border:2px solid #e1bee7; box-sizing:border-box}
.btn-main{width:100%; padding:15px; background:linear-gradient(90deg,#9c27b0,#7b1fa2); color:white; border:none; border-radius:12px; font-weight:bold; font-size:16px; cursor:pointer}
#userPage{display:none}
.gmail-card{background:#f3e5f5; padding:12px; border-radius:12px; margin:8px 0; display:flex; justify-content:space-between; align-items:center}
.badge{padding:5px 10px; border-radius:20px; font-size:11px; font-weight:bold}
.badge.belum{background:#ffecb3; color:#ff6f00}
.badge.sudah{background:#c8e6c9; color:#2e7d32}
.generate-btn{background:#7b1fa2; color:white; border:none; padding:10px 15px; border-radius:10px; margin:10px 0; cursor:pointer}
</style>
</head>
<body>

<div id="loginPage" class="box">
  <div class="logo"><h1>💜 GMAIL HUB</h1><p style="color:#7b1fa2">by Syahdan</p></div>
  
  <div class="tabs">
    <button id="tabMasuk" class="active" onclick="showTab('masuk')">Masuk</button>
    <button id="tabDaftar" onclick="showTab('daftar')">Daftar</button>
  </div>
  
  <button class="btn-google" onclick="loginGoogle()"> <img src="https://www.google.com/favicon.ico" width="20"> Masuk dengan Google</button>
  <div style="text-align:center; margin:15px 0; color:#888">atau</div>
  
  <div id="formDaftar" style="display:none">
    <input id="regNama" placeholder="Nama Lengkap">
    <input id="regRef" placeholder="Kode Referral Opsional">
  </div>
  
  <input id="authEmail" type="email" placeholder="Email kamu">
  <input id="authPass" type="password" placeholder="Password minimal 6">
  <button class="btn-main" id="btnAuth" onclick="doAuth()">Masuk</button>
</div>

<div id="userPage" class="box">
  <h3>Dashboard Gmail</h3>
  <div style="background:#fff8e1; padding:12px; border-radius:12px; border-left:4px solid #ffc107">
    <b>Password Wajib:</b> <code>sgsg1122</code>
  </div>
  
  <h4>Generate Email Otomatis</h4>
  <button class="generate-btn" onclick="generateEmails(10)">+ Generate 10 Email</button>
  <div id="listGenerated"></div>
  <button class="btn-main" onclick="copyAll()">Salin Semua</button>
  <button style="background:#ccc; margin-top:10px" onclick="logout()">Logout</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://tauldodrbmanvlvmefhn.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhdWxkb2RyYm1hbnZsdm1lZmhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjgwMjIsImV4cCI6MjEwMzk0NDAyMn0.qirKxo4Hfw3uYCLFInSvd09_1gLhJfve8VDTnGaCZWw'
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
var NOW = null;

function showTab(t){
  tabMasuk.classList.remove('active'); tabDaftar.classList.remove('active');
  if(t=='masuk'){tabMasuk.classList.add('active'); formDaftar.style.display='none'; btnAuth.innerText='Masuk'}
  else{tabDaftar.classList.add('active'); formDaftar.style.display='block'; btnAuth.innerText='Daftar Sekarang'}
}

async function doAuth(){
  let e=authEmail.value, p=authPass.value;
  if(tabDaftar.classList.contains('active')){
    const {error} = await supa.auth.signUp({email:e, password:p})
    if(error) return alert(error.message); alert('Daftar berhasil! Silahkan login');
  }else{
    const {error} = await supa.auth.signInWithPassword({email:e, password:p})
    if(error) return alert(error.message);
  }
  cekUser();
}

async function loginGoogle(){
  const {error} = await supa.auth.signInWithOAuth({
    provider: 'google',
    options: {redirectTo: window.location.origin}
  })
  if(error) alert('Aktifin dulu Google di Supabase > Authentication > Providers');
}

async function cekUser(){
  const {data} = await supa.auth.getUser();
  if(data.user){
    NOW = data.user;
    loginPage.style.display='none'; 
    userPage.style.display='block';
    loadGenerated();
  }
}

function generateRandomEmail(){
  const names = ['akun','mail','user','gmail','inbox','s3l'];
  const num = Math.floor(Math.random()*9999);
  return names[Math.floor(Math.random()*names.length)] + num + '@gmail.com';
}

async function generateEmails(jumlah){
  let emails = [];
  for(let i=0;i<jumlah;i++){
    emails.push({
      user_id: NOW.id,
      generated_email: generateRandomEmail(),
      password: 'sgsg1122',
      is_stored: false
    })
  }
  await supa.from('generated_gmails').insert(emails);
  loadGenerated();
}

async function loadGenerated(){
  const {data} = await supa.from('generated_gmails').select('*').eq('user_id', NOW.id).order('id', {ascending:false});
  listGenerated.innerHTML = data.map(g=>`
    <div class="gmail-card">
      <span onclick="copyText('${g.generated_email}')">${g.generated_email}</span>
      <span class="badge ${g.is_stored ? 'sudah' : 'belum'}">${g.is_stored ? 'Sudah Stor' : 'Belum Stor'}</span>
    </div>
  `).join('');
}

function copyText(t){ navigator.clipboard.writeText(t); alert('Disalin!') }
function copyAll(){
  let all = Array.from(listGenerated.querySelectorAll('span')).map(s=>s.innerText).join('\n');
  navigator.clipboard.writeText(all); alert('Semua disalin!');
}
async function logout(){ await supa.auth.signOut(); location.reload(); }

cekUser(); // auto login kalau masih ada session
</script>
</body>
</html>
