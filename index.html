<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setoran Harian</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // INI KODE KAMU
  const firebaseConfig = {
    apiKey: "AIzaSyBBI3sYLUgIf8RL-XNRHkguAEM3ssHhetE",
    authDomain: "setoran-syahdantampan.firebaseapp.com",
    projectId: "setoran-syahdantampan",
    storageBucket: "setoran-syahdantampan.firebasestorage.app",
    messagingSenderId: "202438437194",
    appId: "1:202438437194:web:b049b1a12eed3aa33cb9b3",
    measurementId: "G-891LD887E2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const setoranRef = collection(db, "setoran");

  let dataSetoran = [];

  window.tambahSetoran = async function() {
    const nama = document.getElementById('nama').value;
    const nominal = document.getElementById('nominal').value;
    const tanggal = document.getElementById('tanggal').value;
    const keterangan = document.getElementById('keterangan').value;

    if(!nama || !nominal || !tanggal) {
      alert('Nama, Nominal, dan Tanggal wajib diisi!');
      return;
    }

    await addDoc(setoranRef, {
      nama, nominal: Number(nominal), tanggal, keterangan,
      createdAt: new Date()
    });
    
    document.getElementById('nama').value = '';
    document.getElementById('nominal').value = '';
    document.getElementById('keterangan').value = '';
  }

  window.hapusData = async function(id) {
    if(confirm('Yakin hapus data ini?')){
      await deleteDoc(doc(db, "setoran", id));
    }
  }

  function renderTabel() {
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    let total = 0;
    dataSetoran.forEach((d) => {
      total += d.nominal;
      tbody.innerHTML += `
        <tr class="border-b">
          <td class="p-2">${d.tanggal}</td>
          <td class="p-2">${d.nama}</td>
          <td class="p-2 text-right">Rp ${d.nominal.toLocaleString('id-ID')}</td>
          <td class="p-2">${d.keterangan}</td>
          <td class="p-2 text-center"><button onclick="hapusData('${d.id}')" class="text-red-500">Hapus</button></td>
        </tr>
      `;
    });
    document.getElementById('total').innerText = `Total: Rp ${total.toLocaleString('id-ID')}`;
  }

  const q = query(setoranRef, orderBy("createdAt", "desc"));
  onSnapshot(q, (snapshot) => {
    dataSetoran = [];
    snapshot.forEach((docSnap) => {
      dataSetoran.push({ id: docSnap.id, ...docSnap.data() });
    });
    renderTabel();
  });

</script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow">
    <h1 class="text-2xl font-bold mb-4">📒 Catatan Setoran Harian</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-4">
      <input id="tanggal" type="date" class="border p-2 rounded">
      <input id="nama" type="text" placeholder="Nama" class="border p-2 rounded">
      <input id="nominal" type="number" placeholder="Nominal" class="border p-2 rounded">
      <input id="keterangan" type="text" placeholder="Keterangan" class="border p-2 rounded">
    </div>
    <button onclick="tambahSetoran()" class="bg-blue-500 text-white px-4 py-2 rounded mb-4">Tambah Setoran</button>
    
    <h2 id="total" class="text-xl font-semibold mb-2">Total: Rp 0</h2>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-200">
          <tr><th class="p-2">Tanggal</th><th class="p-2">Nama</th><th class="p-2">Nominal</th><th class="p-2">Keterangan</th><th class="p-2">Aksi</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</body>
</html>
